# Pull request titles follow Conventional Commits (feat: …, fix: …, docs: …, chore: …): a pull
# request is squash-merged and its title becomes the commit on main. This check fails while the
# title doesn't; editing the title re-runs it. It reads only the title, never the pull request's code.
name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
